name: Cleanup GHCR

on:
  schedule:
    - cron: "37 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup GHCR images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          owner: ${{ github.repository_owner }}
          package: hermes-agent-custom-image
          dry-run: true
          delete-untagged: true
          keep-n-tagged: 20
          exclude-tags: latest,upstream-*,v*
