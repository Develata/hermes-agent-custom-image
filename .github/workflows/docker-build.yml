name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

env:
  IMAGE_NAME: hermes-agent-custom-image
  UPSTREAM_IMAGE: nousresearch/hermes-agent:latest

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        id: ghcr-login
        uses: docker/login-action@v4
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retry GHCR login
        if: steps.ghcr-login.outcome != 'success'
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            if printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          exit 1

      - name: Set lowercase image owner
        shell: bash
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set image date
        shell: bash
        run: echo "IMAGE_DATE=$(date +%F)" >> "$GITHUB_ENV"

      - name: Check upstream digest
        id: upstream
        shell: bash
        run: |
          upstream_digest="$(docker buildx imagetools inspect "${UPSTREAM_IMAGE}" --format '{{.Manifest.Digest}}')"
          upstream_tag="upstream-${upstream_digest#sha256:}"
          custom_image="ghcr.io/${IMAGE_OWNER}/${IMAGE_NAME}"

          echo "digest=${upstream_digest}" >> "$GITHUB_OUTPUT"
          echo "tag=${upstream_tag}" >> "$GITHUB_OUTPUT"
          echo "custom_image=${custom_image}" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "reason=${GITHUB_EVENT_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if docker manifest inspect "${custom_image}:${upstream_tag}" >/dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "reason=upstream digest already built" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "reason=new upstream digest" >> "$GITHUB_OUTPUT"
          fi

      - name: Print build decision
        shell: bash
        run: |
          echo "Upstream image: ${UPSTREAM_IMAGE}"
          echo "Upstream digest: ${{ steps.upstream.outputs.digest }}"
          echo "Digest tag: ${{ steps.upstream.outputs.tag }}"
          echo "Should build: ${{ steps.upstream.outputs.should_build }}"
          echo "Reason: ${{ steps.upstream.outputs.reason }}"

      - name: Build Docker image
        if: steps.upstream.outputs.should_build == 'true'
        shell: bash
        run: |
          docker build --pull \
            --build-arg UPSTREAM_IMAGE="${UPSTREAM_IMAGE}" \
            --label org.opencontainers.image.base.name="${UPSTREAM_IMAGE}" \
            --label org.opencontainers.image.base.digest="${{ steps.upstream.outputs.digest }}" \
            -t "${{ steps.upstream.outputs.custom_image }}:latest" \
            -t "${{ steps.upstream.outputs.custom_image }}:${IMAGE_DATE}" \
            -t "${{ steps.upstream.outputs.custom_image }}:${{ steps.upstream.outputs.tag }}" \
            .

      - name: Push Docker image
        if: steps.upstream.outputs.should_build == 'true'
        shell: bash
        run: |
          docker push "${{ steps.upstream.outputs.custom_image }}:latest"
          docker push "${{ steps.upstream.outputs.custom_image }}:${IMAGE_DATE}"
          docker push "${{ steps.upstream.outputs.custom_image }}:${{ steps.upstream.outputs.tag }}"

      - name: Log out from GitHub Container Registry
        if: always()
        shell: bash
        run: docker logout ghcr.io || true
