name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

env:
  IMAGE_NAME: hermes-agent-custom-image

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        id: ghcr-login
        uses: docker/login-action@v4
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retry GHCR login
        if: steps.ghcr-login.outcome != 'success'
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            if printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          exit 1

      - name: Set lowercase image owner
        shell: bash
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set image date
        shell: bash
        run: echo "IMAGE_DATE=$(date +%F)" >> "$GITHUB_ENV"

      - name: Build Docker image
        shell: bash
        run: |
          docker build --pull \
            -t ghcr.io/${IMAGE_OWNER}/${IMAGE_NAME}:latest \
            -t ghcr.io/${IMAGE_OWNER}/${IMAGE_NAME}:${IMAGE_DATE} \
            .

      - name: Push Docker image
        shell: bash
        run: |
          docker push ghcr.io/${IMAGE_OWNER}/${IMAGE_NAME}:latest
          docker push ghcr.io/${IMAGE_OWNER}/${IMAGE_NAME}:${IMAGE_DATE}

      - name: Log out from GitHub Container Registry
        if: always()
        shell: bash
        run: docker logout ghcr.io || true
