name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

env:
  IMAGE_NAME: hermes-agent-custom-image

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image owner
        shell: bash
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set image date
        shell: bash
        run: echo "IMAGE_DATE=$(date +%F)" >> "$GITHUB_ENV"

      - name: Build Docker image
        shell: bash
        run: |
          docker build --pull \
            -t ghcr.io/${IMAGE_OWNER}/${IMAGE_NAME}:latest \
            -t ghcr.io/${IMAGE_OWNER}/${IMAGE_NAME}:${IMAGE_DATE} \
            .

      - name: Push Docker image
        shell: bash
        run: |
          docker push ghcr.io/${IMAGE_OWNER}/${IMAGE_NAME}:latest
          docker push ghcr.io/${IMAGE_OWNER}/${IMAGE_NAME}:${IMAGE_DATE}
