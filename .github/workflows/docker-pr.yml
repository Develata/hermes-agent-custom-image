name: Validate Docker Image

on:
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - "scripts/**"
      - ".github/workflows/docker-pr.yml"
      - ".github/workflows/docker-build.yml"

concurrency:
  group: docker-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  UPSTREAM_IMAGE: nousresearch/hermes-agent:latest

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve upstream image digest
        id: upstream
        shell: bash
        run: |
          upstream_digest=""
          for attempt in 1 2 3 4 5; do
            if upstream_digest="$(docker buildx imagetools inspect "${UPSTREAM_IMAGE}" --format '{{.Manifest.Digest}}')"; then
              break
            fi
            echo "::warning::Upstream digest lookup failed (attempt ${attempt}/5)"
            [ "${attempt}" -eq 5 ] || sleep $((attempt * 15))
          done

          if [ -z "${upstream_digest}" ]; then
            echo "::error::Unable to resolve upstream image digest"
            exit 1
          fi

          echo "digest=${upstream_digest}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        shell: bash
        run: |
          base_ref="${UPSTREAM_IMAGE}@${{ steps.upstream.outputs.digest }}"
          docker build --pull \
            --build-arg UPSTREAM_IMAGE="${base_ref}" \
            -t hermes-agent-custom-image:pr \
            .

      - name: Smoke test Docker image
        shell: bash
        run: |
          docker run --rm hermes-agent-custom-image:pr \
            sh -lc hermes-custom-image-smoke
